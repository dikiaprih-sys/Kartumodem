<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendataan Nomor Lokasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3F7FC;
    --surface: #FFFFFF;
    --ink: #12305A;
    --muted: #6E7F94;
    --line: #D7E3F1;
    --accent: #1D5FB8;
    --accent-ink: #FFFFFF;
    --accent-soft: #E7F0FB;
    --danger: #B3423A;
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .brand-bar{
    background: var(--surface);
    padding: 16px 20px;
    display: flex;
    justify-content: center;
    border-bottom: 1px solid var(--line);
  }
  .brand-logo{
    height: 42px;
    width: auto;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 80px;
  }
  header.page h1{
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0 0 6px;
  }
  header.page p{
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
  }
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
  }
  .field{
    position: relative;
    margin-bottom: 14px;
  }
  .field label{
    display:block;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .field input, .field select{
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
  }
  .field select{
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%236E7F94'><path d='M5.5 7.5l4.5 5 4.5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 11px center;
    background-size: 16px;
    padding-right: 34px;
  }
  .field input:focus, .field select:focus, button:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .suggestions{
    display:none;
    position: absolute;
    top: 100%; left: 0; right: 0;
    margin-top: 2px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 7px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 30;
    box-shadow: 0 6px 16px rgba(18,48,90,0.14);
  }
  .suggestions.show{ display:block; }
  .suggestions div{
    padding: 9px 12px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .suggestions div:last-child{ border-bottom: none; }
  .suggestions div:hover{ background: var(--accent-soft); }

  button#submit-btn{
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  button#submit-btn:disabled{ opacity: .55; cursor: default; }
  .form-msg{
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
  }
  .form-msg.error{ color: var(--danger); }
  .form-msg.ok{ color: var(--accent); }

  .dash-header{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 32px 0 12px;
  }
  .dash-header h2{
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 19px;
    margin: 0;
  }
  .refresh-btn{
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px;
  }
  input#search{
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    margin-bottom: 14px;
  }
  ul.entries{
    list-style: none;
    margin:0; padding:0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
  }
  ul.entries li{
    padding: 10px 13px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px;
    font-size: 13.5px;
  }
  ul.entries li:last-child{ border-bottom: none; }
  .entry-text{ font-weight: 500; }
  .meta{ margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }

  .empty, .loading{
    text-align: center;
    padding: 30px 16px;
    color: var(--muted);
    font-size: 14px;
  }

  .tabs{
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .tab-btn{
    flex: 1;
    padding: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 7px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
  }
  .tab-btn.active{
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .tab-panel{ display: none; }
  .tab-panel.active{ display: block; }
</style>
</head>

let allData = [];

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showMsg(text, isError){
  const el = document.getElementById('form-msg');
  el.textContent = text;
  el.className = 'form-msg ' + (isError ? 'error' : 'ok');
  if(text){
    setTimeout(()=>{ if(el.textContent === text){ el.textContent=''; el.className='form-msg'; } }, 3000);
  }
}

function getLocationOptions(){
  const fromData = allData.map(d => d.Lokasi).filter(Boolean);
  return [...new Set([...PRESET_LOCATIONS, ...fromData])].sort((a,b)=>a.localeCompare(b));
}

function setupAutocomplete(inputEl, boxEl, getOptions, maxResults){
  function renderSuggestions(){
    const q = inputEl.value.trim().toLowerCase();
    if(!q){ boxEl.classList.remove('show'); boxEl.innerHTML=''; return; }
    const matches = getOptions().filter(o => o.toLowerCase().includes(q)).slice(0, maxResults || 8);
    if(matches.length === 0){ boxEl.classList.remove('show'); boxEl.innerHTML=''; return; }
    boxEl.innerHTML = matches.map(m => `<div data-val="${escapeHtml(m)}">${escapeHtml(m)}</div>`).join('');
    boxEl.classList.add('show');
  }
  inputEl.addEventListener('input', renderSuggestions);
  inputEl.addEventListener('focus', renderSuggestions);
  boxEl.addEventListener('pointerdown', (e) => {
    const item = e.target.closest('div[data-val]');
    if(!item) return;
    e.preventDefault();
    inputEl.value = item.getAttribute('data-val');
    boxEl.classList.remove('show');
    boxEl.innerHTML = '';
  });
  document.addEventListener('click', (e) => {
    if(e.target !== inputEl && !boxEl.contains(e.target)){
      boxEl.classList.remove('show');
    }
  });
}

async function loadData(){
  const area = document.getElementById('list-area');
  area.innerHTML = '<div class="loading">Memuat data…</div>';
  try{
    const res = await fetch(APPS_SCRIPT_URL);
    if(!res.ok) throw new Error('bad response');
    allData = await res.json();
  }catch(e){
    area.innerHTML = '<div class="empty">Gagal memuat data. Pastikan APPS_SCRIPT_URL di kode sudah diisi dengan benar dan Apps Script sudah di-deploy sebagai Web App ("Anyone" access).</div>';
    return;
  }
  render();
}

function render(){
  const area = document.getElementById('list-area');
  const q = document.getElementById('search').value.trim().toLowerCase();

  const filtered = allData.filter(d => {
    if(!q) return true;
    return (d.Lokasi||'').toLowerCase().includes(q) ||
           (d.Nomer||'').toString().toLowerCase().includes(q) ||
           (d.Provider||'').toLowerCase().includes(q);
  });

  if(allData.length === 0){
    area.innerHTML = '<div class="empty">Belum ada data. Isi form di atas untuk mulai mendata.</div>';
    return;
  }
  if(filtered.length === 0){
    area.innerHTML = '<div class="empty">Tidak ada hasil untuk pencarian ini.</div>';
    return;
  }

  const sorted = filtered.slice().sort((a,b)=> new Date(b.Timestamp) - new Date(a.Timestamp));

  const items = sorted.map(d => {
    const when = d.Timestamp ? new Date(d.Timestamp).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }) : '';
    const loc = d.Lokasi || '(Tanpa lokasi)';
    const parts = [loc, d.Nomer || '-', d.Provider || '-'];
    return `
      <li>
        <span class="entry-text">${escapeHtml(parts.join(' - '))}</span>
        <span class="meta">${escapeHtml(when)}</span>
      </li>`;
  }).join('');

  area.innerHTML = `<ul class="entries">${items}</ul>`;
}

document.getElementById('entry-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById('submit-btn');
  const lokasiEl = document.getElementById('lokasi');
  const nomerEl = document.getElementById('nomer');
  const providerEl = document.getElementById('provider');

  const payload = {
    lokasi: lokasiEl.value.trim(),
    nomer: nomerEl.value.trim(),
    provider: providerEl.value.trim()
  };

  if(!payload.lokasi || !payload.nomer){
    showMsg('Nama lokasi dan nomer wajib diisi.', true);
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Mengirim…';
  const slowNotice = setTimeout(() => {
    btn.textContent = 'Sedang menyimpan, mohon tunggu…';
  }, 4000);

  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    if(result.status !== 'ok') throw new Error(result.message || 'gagal');

    showMsg('Data tersimpan.', false);
    lokasiEl.value = '';
    nomerEl.value = '';
    providerEl.value = '';
    lokasiEl.focus();
    await loadData();
  }catch(e){
    showMsg('Gagal mengirim data. Cek koneksi atau URL Apps Script.', true);
  }
  clearTimeout(slowNotice);
  btn.disabled = false;
  btn.textContent = 'Kirim';
});

document.getElementById('search').addEventListener('input', render);
document.getElementById('refresh-btn').addEventListener('click', loadData);

setupAutocomplete(document.getElementById('lokasi'), document.getElementById('lokasi-suggestions'), getLocationOptions, 8);

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'dashboard'){
      loadData();
    }
  });
});

loadData();
